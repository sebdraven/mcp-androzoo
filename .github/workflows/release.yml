name: release

# Tags only: a publication should be named and deliberate, not a side effect of
# merging to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No image: the server runs over stdio, needs an API key it cannot carry, and
  # needs a multi-gigabyte catalogue file mounted from the host. The binaries
  # are the distribution.
  binaries:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # No cache in a publishing workflow: an entry poisoned on a branch
          # would be baked into a release artefact.
          cache: false

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          ldflags="-s -w -X main.version=${TAG}"
          go build -trimpath -ldflags="$ldflags" -o "mcp-androzoo-${suffix}" ./cmd/mcp-androzoo
          go build -trimpath -ldflags="$ldflags" -o "azdl-${suffix}" ./cmd/azdl
          shasum -a 256 "mcp-androzoo-${suffix}" "azdl-${suffix}" > "checksums-${suffix}.txt"

      - name: publish the artefacts
        # gh ships on every runner, so a third-party action here would add a
        # supply-chain dependency for something the runner already does.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          # The matrix legs race to create the release; the losers fail
          # harmlessly and go straight to uploading.
          gh release create "$TAG" --generate-notes --verify-tag || true
          gh release upload "$TAG" --clobber \
            "mcp-androzoo-${suffix}" \
            "azdl-${suffix}" \
            "checksums-${suffix}.txt"
